# SPDX-License-Identifier: MIT
# Known-vulnerability check for the pinned dependencies. Weekly, because an
# advisory lands on a pin that has not changed; and on pull requests that change
# a pin, so a bump is checked before it merges.
name: audit

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - requirements*.txt
      - image/requirements.txt
      - web/package*.json
      - .github/workflows/audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Python
        run: |
          python -m venv .venv
          .venv/bin/pip install pip-audit==2.10.1
          .venv/bin/pip-audit -r requirements-dev.txt -r image/requirements.txt

      - name: Drive
        run: npm --prefix web audit --omit=dev
