# SPDX-License-Identifier: MIT
# Build the three images on changes that can break them, so a bad base digest,
# noVNC checksum or pin shows up on the pull request instead of at release.
# Nothing is pushed; publish-image.yml does that from tags.
name: images

on:
  push:
    branches: [main]
    paths:
      - image/**
      - Dockerfile.*
      - .dockerignore
      - compose.yaml
      - requirements.txt
      - web/package*.json
      - .github/workflows/images.yml
  pull_request:
    paths:
      - image/**
      - Dockerfile.*
      - .dockerignore
      - compose.yaml
      - requirements.txt
      - web/package*.json
      - .github/workflows/images.yml

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: desk
            context: ./image
            file: ./image/Dockerfile
          - name: control
            context: .
            file: ./Dockerfile.cased
          - name: ui
            context: .
            file: ./Dockerfile.ui
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          cache-from: type=gha,scope=check-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=check-${{ matrix.name }}
          push: false
